# merget-harness live benchmark CI: the recipe the benchmark VM discovered for
# this corpus, run on every pull request, on main and on sema's batch branches.
# The corpus's own workflows are removed on the mirror (docs/SCENARIOS.md "bench").
name: bench-ci
on:
  push:
    branches:
      - "main"
      - "sema/queue/**"
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "sbt"
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch -Dsbt.color=false coreJVM/compile
      - run: sbt -batch -Dsbt.color=false coreJVM/Test/compile
